<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent Calculator</title>
  
  <!-- Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">

  <!-- Google Fonts & Stylesheet -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">🏠</div>
        <div>
          <h1>Rent Calculator</h1>
          <p>Instant Online, Cash & Brokerage Breakdown</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">🌙</button>
    </header>

    <!-- Rent Form -->
    <form id="rentForm" onsubmit="return false;">
      
      <!-- Rent Input -->
      <div class="form-group">
        <label for="rent">Rent Amount (₹)</label>
        <div class="input-wrapper">
          <span class="icon">₹</span>
          <input type="number" id="rent" class="form-control" placeholder="e.g. 23000" min="0">
        </div>
        <div class="error-message" id="rentError">Please enter Rent</div>
      </div>

      <!-- People Select Dropdown -->
      <div class="form-group">
        <label for="people">How Many People Stay?</label>
        <div class="input-wrapper">
          <span class="icon">👥</span>
          <select id="people" class="form-control">
            <option value="" disabled selected>Select number of people</option>
            <option value="1">1 Person</option>
            <option value="2">2 People</option>
            <option value="3">3 People</option>
            <option value="4">4 People</option>
            <option value="5">5 People</option>
            <option value="6">6 People</option>
            <option value="7">7 People</option>
            <option value="8">8 People</option>
            <option value="9">9 People</option>
            <option value="10">10 People</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
        <div class="error-message" id="peopleError">Please select How Many People Stay</div>
      </div>

      <!-- Token Input -->
      <div class="form-group">
        <label for="token">Token Amount (₹)</label>
        <div class="input-wrapper">
          <span class="icon">💸</span>
          <input type="number" id="token" class="form-control" placeholder="e.g. 5000" min="0">
        </div>
        <div class="error-message" id="tokenError">Please enter Token</div>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="button" class="btn btn-primary" id="calculateBtn">Calculate</button>
        <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>

    </form>

    <!-- Results Section -->
    <div class="results-container">
      <div class="result-card">
        <div class="result-info">
          <span class="result-label">Online</span>
          <span class="result-value" id="onlineResult">₹0</span>
        </div>
      </div>

      <div class="result-card highlight">
        <div class="result-info">
          <span class="result-label">Cash</span>
          <span class="result-value" id="cashResult">₹0</span>
        </div>
      </div>

      <div class="result-card brokerage">
        <div class="result-info">
          <span class="result-label">Brokerage</span>
          <span class="result-value" id="brokerageResult">₹0</span>
        </div>
      </div>

      <button type="button" class="btn-copy" id="copyBtn">📋 Copy Breakdown</button>
    </div>

  </div>

  <!-- JavaScript File Link -->
  <script src="script.js"></script>
</body>
</html>
