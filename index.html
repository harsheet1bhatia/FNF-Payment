<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent Calculator</title>
<style>
body{font-family:Arial;background:#e9f7ef;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.15);width:360px}
h2{text-align:center;color:#198754}label{font-weight:bold;display:block;margin-top:12px}
input,select{width:100%;padding:11px;border:2px solid #ccc;border-radius:10px;background:#fff}
.err{color:#d00;font-size:12px;min-height:16px;margin-top:3px}
button{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;margin-top:12px;cursor:pointer}
.calc{background:#198754}.reset{background:#dc3545}
.out{margin-top:18px;background:#f4fff7;border-radius:12px;padding:10px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}.row:last-child{border:none}
.credit{text-align:right;font-size:11px;color:#777;margin-top:10px}
</style></head><body><div class="card"><h2>Rent Calculator</h2>
<label>Rent</label><input id="rent" type="number"><div class="err" id="erent"></div>
<label>How Many People Stay?</label><select id="people"><option value="">Select</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select><div class="err" id="epeople"></div>
<label>Token</label><input id="token" type="number"><div class="err" id="etoken"></div>
<button class="calc" onclick="calculate()">Calculate</button>
<button class="reset" onclick="resetData()">Reset</button>
<div class="out">
<div class="row"><span>Online</span><b id="online">₹0</b></div>
<div class="row"><span>Cash</span><b id="cash">₹0</b></div>
<div class="row"><span>Brokerage</span><b id="brokerage">₹0</b></div>
</div><div class="credit">Built by Harsheet</div></div>
<script>
function clr(){['erent','epeople','etoken'].forEach(i=>document.getElementById(i).textContent='');}
function calculate(){
clr();
let rv=rent.value.trim(),pv=people.value.trim(),tv=token.value.trim(),ok=true;
if(!rv){erent.textContent='Please enter Rent';ok=false;}
if(!pv){epeople.textContent='Please enter How Many People Stay?';ok=false;}
if(!tv){etoken.textContent='Please enter Token';ok=false;}
if(!ok)return;
let r=+rv,p=+pv,t=+tv;
let doc=(p*500)+500,sec=r,on,cash;
if(r<=19000){on=r+doc+(sec-t);cash=0;}else{on=20000+(sec-t);cash=(r-20000)+doc;}
let bro=r/2;
online.textContent='₹'+on.toLocaleString();
cash.textContent='₹'+cash.toLocaleString();
brokerage.textContent='₹'+bro.toLocaleString();
}
function resetData(){rent.value='';people.value='';token.value='';clr();online.textContent='₹0';cash.textContent='₹0';brokerage.textContent='₹0';}
</script></body></html>
