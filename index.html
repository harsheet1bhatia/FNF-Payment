<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rent Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="container">
<div class="card">
<button id="themeBtn" class="theme-btn">🌙</button>
<h1>Rent Calculator</h1>

<div class="form-group">
<label>Rent</label>
<input id="rent" type="number" placeholder="Enter Rent">
<small id="rentError" class="error"></small>
</div>

<div class="form-group">
<label>How Many People Stay?</label>
<select id="people">
<option value="">Select</option>
<option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
</select>
<small id="peopleError" class="error"></small>
</div>

<div class="form-group">
<label>Token</label>
<input id="token" type="number" placeholder="Enter Token">
<small id="tokenError" class="error"></small>
</div>

<button id="calculateBtn" class="calculate-btn">Calculate</button>
<button id="resetBtn" class="reset-btn">Reset</button>

<div class="results">
<div class="result-card"><span>Online</span><strong id="onlineResult">₹0</strong></div>
<div class="result-card"><span>Cash</span><strong id="cashResult">₹0</strong></div>
<div class="result-card"><span>Brokerage</span><strong id="brokerageResult">₹0</strong></div>
<button id="copyBtn" class="copy-btn">📋 Copy Result</button>
</div>

</div>
</div>
<script src="script.js"></script>
</body>
</html>
