<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Calculator</title>

    <!-- Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Rent Calculator</h1>

        <!-- Rent -->
        <div class="form-group">
            <label>Rent</label>
            <input
                type="number"
                id="rent"
                placeholder="Enter Rent">
            <small class="error" id="rentError"></small>
        </div>

        <!-- People -->
        <div class="form-group">
            <label>How Many People Stay?</label>

            <select id="people">
                <option value="">Select</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
            </select>

            <small class="error" id="peopleError"></small>

        </div>

        <!-- Token -->
        <div class="form-group">
            <label>Token</label>

            <input
                type="number"
                id="token"
                placeholder="Enter Token">

            <small class="error" id="tokenError"></small>

        </div>

        <!-- Buttons -->

        <button id="calculateBtn" class="calculate-btn">
            Calculate
        </button>

        <button id="resetBtn" class="reset-btn">
            Reset
        </button>

        <!-- Results -->

        <div class="result-card">
            <span>Online</span>
            <strong id="onlineResult">₹0</strong>
        </div>

        <div class="result-card">
            <span>Cash</span>
            <strong id="cashResult">₹0</strong>
        </div>

        <div class="result-card">
            <span>Brokerage</span>
            <strong id="brokerageResult">₹0</strong>
        </div>

        <!-- Copy -->

        <button id="copyBtn" class="copy-btn">
            📋 Copy Result
        </button>

        <!-- Dark Mode -->

        <button id="themeBtn" class="theme-btn">
            🌙 Dark Mode
        </button>

        <p class="footer">
            Built by Harsheet
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
